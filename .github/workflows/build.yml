name: 编译 DSM 7.1.1 兼容包（moviepilot 服务）

on:
  push:
    tags:
      - 'v*'  # 标签触发（如 v1.0.0，版本号将用于 SPK 包）
    branches:
      - main  # 可选：主分支推送时触发测试构建

jobs:
  build-dsm-spk:
    name: 构建 DSM 7.1.1 (x86_64)
    runs-on: ubuntu-20.04  # 适配 DSM 旧版编译环境
    env:
      DSM_VERSION: "7.1.1"      # 目标 DSM 版本
      ARCH: "x86_64"           # 设备架构（x86_64 适配绝大多数机型）
      PDK_VERSION: "1.2.10"     # 兼容 DSM 7.1.1 的 PDK 版本
      SERVICE_NAME: "moviepilot"# 服务名（与 conf/scripts 中一致）
      BINARY_NAME: "moviepilot" # 二进制文件名（与编译产物一致）

    steps:
      ### 1. 检出代码（含子模块）
      - name: 检出项目代码
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 若有子模块，需递归检出

      ### 2. 安装基础依赖（Docker + 编译工具）
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar gzip make gcc libc6-dev
          # 安装并启动 Docker（PDK 依赖容器环境）
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo usermod -aG docker $USER

      ### 3. 下载并初始化 Synology PDK
      - name: 部署 Synology PDK 工具链
        run: |
          # 下载 PDK
          curl -L "https://github.com/SynologyOpenSource/pkgscripts-ng/releases/download/${PDK_VERSION}/pkgscripts-ng-${PDK_VERSION}.tar.gz" -o pdk.tar.gz
          mkdir -p /opt/pdk
          tar -zxf pdk.tar.gz -C /opt/pdk --strip-components=1
          # 初始化 PDK 环境（指定 DSM 版本和架构）
          /opt/pdk/EnvDeploy -v ${DSM_VERSION} -p ${ARCH}
          # 添加交叉编译工具到环境变量
          echo "/toolkit/build_env/ds.${ARCH}-${DSM_VERSION}/bin" >> $GITHUB_PATH

      ### 4. 编译项目（生成 moviepilot 二进制文件）
      - name: 交叉编译 moviepilot
        run: |
          # 进入源码目录（根据实际项目结构调整，示例：src/ 目录）
          cd src/
          # 示例：若为 C/C++ 项目，使用交叉编译器
          make CC=x86_64-pc-linux-gnu-gcc CXX=x86_64-pc-linux-gnu-g++
          # 验证二进制文件架构（必须为 x86-64）
          file ./${BINARY_NAME} | grep "x86-64"

      ### 5. 构建 DSM 安装包（.spk）
      - name: 打包为 SPK 格式
        run: |
          # 创建 SPK 标准目录结构
          mkdir -p spk/{package/bin,conf,scripts}
          # 复制编译产物
          cp src/${BINARY_NAME} spk/package/bin/
          # 复制服务配置和脚本
          cp conf/${SERVICE_NAME}.service spk/conf/
          cp scripts/* spk/scripts/
          # 生成 INFO 文件（SPK 元数据）
          cat > spk/INFO << EOF
          package="${SERVICE_NAME}"
          version="${{ github.ref_name || 'dev' }}"  # 从标签获取版本
          description="MoviePilot 服务包（DSM 7.1.1 兼容）"
          arch="${ARCH}"
          dsm_version_min="7.1.1"
          maintainer="your-github-username"  # 替换为实际维护者
          EOF
          # 使用 PDK 打包
          /opt/pdk/pkg_make --output . --source spk

      ### 6. 验证 SPK 完整性
      - name: 检查 SPK 包
        run: |
          ls -lh *.spk  # 确保文件存在
          # 可选：PDK 官方校验工具
          /opt/pdk/pkg_check --file ${SERVICE_NAME}-${{ github.ref_name }}.spk

      ### 7. 上传 DSM 安装包
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsm711-${ARCH}-${{ github.ref_name }}
          path: "*.spk"
          retention-days: 30  # 保留 30 天
