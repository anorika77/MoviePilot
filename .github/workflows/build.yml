name: 构建 DSM 7.1.1 套件（MoviePilot）

# 触发条件：推送标签时触发（如 v1.0.0）
on:
  push:
    tags:
      - 'v*'

jobs:
  build-spk:
    runs-on: ubuntu-20.04  # 兼容DSM工具链的稳定环境
    env:
      PACKAGE_NAME: "moviepilot"
      DSM_VERSION: "7.1.1"
      ARCH: "x86_64"  # 适配主流Synology x86_64设备（如DS920+）
      # 项目关键路径（根据仓库结构调整）
      APP_DIR: "app"
      REQUIREMENTS: "requirements.txt"
      CONF_DIR: "conf"
      SCRIPTS_DIR: "scripts"

    steps:
      # 步骤1：检出代码（含子模块，必须步骤）
      - name: 检出项目代码及资源
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 拉取MoviePilot-Resources等依赖
          fetch-depth: 1

      # 步骤2：验证核心文件是否存在（防止打包失败）
      - name: 检查必要文件
        run: |
          # 检查服务配置
          if [ ! -f "${{ env.CONF_DIR }}/moviepilot.service" ]; then
            echo "❌ 缺少 ${CONF_DIR}/moviepilot.service"
            exit 1
          fi
          # 检查安装脚本
          for script in install start stop upgrade; do
            if [ ! -f "${{ env.SCRIPTS_DIR }}/$script" ]; then
              echo "❌ 缺少 ${SCRIPTS_DIR}/$script"
              exit 1
            fi
          done
          # 检查项目入口
          if [ ! -d "${{ env.APP_DIR }}" ]; then
            echo "❌ 核心代码目录 ${APP_DIR} 不存在"
            exit 1
          fi
          # 检查依赖清单
          if [ ! -f "${{ env.REQUIREMENTS }}" ]; then
            echo "⚠️ 未找到依赖文件 ${REQUIREMENTS}，将跳过依赖安装"
          fi

      # 步骤3：安装Python及项目依赖（打包时包含）
      - name: 配置Python环境
        if: -f ${{ env.REQUIREMENTS }}  # 仅当依赖文件存在时执行
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # DSM 7.1.1 内置Python版本

      - name: 安装项目依赖到本地目录
        if: -f ${{ env.REQUIREMENTS }}
        run: |
          # 创建依赖目录（打包时会包含）
          mkdir -p ${{ env.APP_DIR }}/lib
          # 安装依赖到项目内（避免依赖系统环境）
          pip install --no-cache-dir -r ${{ env.REQUIREMENTS }} -t ${{ env.APP_DIR }}/lib/

      # 步骤4：使用官方工具打包SPK（核心步骤）
      - name: 构建DSM套件包（.spk）
        uses: SynoCommunity/spk-tools-action@v1.5
        with:
          action: package
          dsm-version: ${{ env.DSM_VERSION }}
          arch: ${{ env.ARCH }}
          package-name: ${{ env.PACKAGE_NAME }}
          # 映射项目文件到SPK标准结构
          source: |
            ${{ env.APP_DIR }} = /app                   # 核心代码
            ${{ env.CONF_DIR }}/moviepilot.service = /conf/moviepilot.service  # 服务配置
            ${{ env.SCRIPTS_DIR }} = /scripts           # 安装/启动脚本
            LICENSE = /LICENSE                           # 许可证
            README.md = /README.md                       # 说明文档
            package.json = /package.json                 # 项目元数据
          # SPK元数据（DSM套件中心显示信息）
          info: |
            package=${{ env.PACKAGE_NAME }}
            version=${{ github.ref_name }}  # 版本号取自标签（如v1.0.0）
            description="MoviePilot媒体管理工具（DSM 7.1.1兼容版）"
            arch=${{ env.ARCH }}
            dsm_version_min=${{ env.DSM_VERSION }}
            maintainer="anorika77"
            support_url="https://github.com/anorika77/MoviePilot/issues"

      # 步骤5：验证SPK包生成
      - name: 检查打包结果
        run: |
          ls -lh *.spk  # 显示生成的套件包
          SPK_FILE="${{ env.PACKAGE_NAME }}-${{ github.ref_name }}.spk"
          if [ ! -f "$SPK_FILE" ]; then
            echo "❌ SPK包生成失败：$SPK_FILE 不存在"
            exit 1
          fi
          if [ $(stat -c%s "$SPK_FILE") -lt 1024 ]; then
            echo "❌ SPK包异常：文件大小过小"
            exit 1
          fi

      # 步骤6：上传最终套件包
      - name: 上传DSM套件包
        uses: actions/upload-artifact@v4
        with:
          name: dsm711-${{ env.ARCH }}-${{ github.ref_name }}
          path: "*.spk"
          retention-days: 90  # 保留90天
          if-no-files-found: error  # 无文件时明确报错
    
